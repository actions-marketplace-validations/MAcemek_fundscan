name: Bug report
description: fundscan reported something wrong, crashed or missed a dependency.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command you ran and the output or error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Relevant dependency file
      description: The part of the manifest or lockfile that is involved, if any.
      render: text
  - type: input
    id: version
    attributes:
      label: fundscan version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: How do you run it?
      placeholder: npx on macOS with Node.js 24, or the GitHub Action
